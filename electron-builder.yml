# PDEfe — electron-builder yapılandırması (Windows: NSIS kurulum sihirbazı, GitHub Releases yayımı; macOS: evrensel DMG, 0.2.0)
# package.json'da "build" alanı YOK; electron-builder bu dosyayı okur (npm run dist / electron-builder --win / --mac --universal).

appId: com.cgrshn.pdefe
productName: PDEfe
copyright: "Geliştirici: x.com/CgrShn"

directories:
  output: release
  buildResources: build

# Uygulama dosyaları asar arşivine konur. Python çekirdeği asar dışında, resources/pdefe-core/ altında durur.
asar: true
# Yalnızca Türkçe ve İngilizce Chromium yerelleştirme dosyaları paketlensin (~8 MB tasarruf)
electronLanguages:
  - tr
  - en-US
compression: maximum   # LZMA; kurulum dosyası belirgin küçülür, derleme daha uzun sürer
npmRebuild: false
nodeGypRebuild: false

# Electron sigortaları (0.1.23, güvenlik denetimi): exe'ye derleme sırasında yazılır, çalışırken değiştirilemez. Varsayılanlar açıktı;
# PDEfe bunların hiçbirini kullanmaz. Kapatılanlar: ELECTRON_RUN_AS_NODE ile exe'nin düz Node.js gibi çalıştırılması, NODE_OPTIONS ve
# --inspect ile ana sürece kod / hata ayıklayıcı sokulması. Açılanlar: uygulama yalnızca app.asar'dan yüklenir ve app.asar'ın bütünlüğü
# (exe'ye gömülü özet) denetlenir; değiştirilmiş app.asar ile PDEfe açılmaz. grantFileProtocolExtraPrivileges değişmedi: yazdırma
# penceresi geçici HTML'i file:// ile yükler (main/yazdir.js).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true

# Uygulamaya girecek dosyalar. package.json otomatik eklenir; üretim bağımlılıkları (dependencies)
# node_modules'dan otomatik toplanır (pdfjs-dist'in cmaps, standard_fonts, wasm, iccs, build klasörleri dahil).
# Aşağıdaki "!" desenleri yalnızca gereksiz parçaları çıkarır.
files:
  - "src/**/*"
  - "build/icon.*"
  - "package.json"
  - "THIRD_PARTY.md"
  - "!**/*.map"
  - "!node_modules/pdfjs-dist/legacy/**"
  - "!node_modules/pdfjs-dist/types/**"
  - "!node_modules/pdfjs-dist/web/**"
  - "!node_modules/pdfjs-dist/image_decoders/**"
  - "!node_modules/pdfjs-dist/webpack.mjs"
  - "!node_modules/pdfjs-dist/build/pdf.sandbox*"
  # pdfjs-dist'in isteğe bağlı bağımlılığı: yalnızca Node ortamında (sunucu tarafı çizim) yüklenir; PDEfe sayfaları
  # sandbox'lı renderer'da tarayıcı canvas'ıyla çizer. 37 MB'lık yerel kütüphane pakete girmesin.
  - "!node_modules/@napi-rs/**"
  - "!**/{CHANGELOG.md,README.md,CODE_OF_CONDUCT.md,.github,.editorconfig,.eslintrc*,tsconfig.json}"

win:
  # Python çekirdeği: cekirdek.js paketliyken process.resourcesPath/pdefe-core/pdefe-core.exe bekler.
  # core/dist/pdefe-core/ (tek klasör: pdefe-core.exe + _internal) "npm run cekirdek:derle" (build/cekirdek-derle.mjs, PyInstaller) ile
  # üretilir. Tek dosya (onefile) değil: her açılışta %TEMP%'e açılıyor, süreç öldürülünce açılan klasör kalıyordu (bkz. core/pdefe-core.spec).
  # 0.2.0: Windows'a özgü (macOS'ta iki mimarinin çekirdeği ayrı klasörlerde, aşağıda mac.extraResources)
  extraResources:
    - from: core/dist/pdefe-core
      to: pdefe-core
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: "PDEfe-Setup.${ext}"
  requestedExecutionLevel: asInvoker
  # .pdf ilişkilendirmesi. DİKKAT (app-builder-lib/out/targets/nsis/NsisTarget.js, APP_ASSOCIATE çağrısı):
  # "name" alanı kayıt defterindeki ProgId (dosya sınıfı) olur, "description" Gezgin'de görünen türdür.
  # ProgId: PDEfe.pdf  →  HKCU\Software\Classes\PDEfe.pdf ve HKCU\Software\Classes\.pdf\OpenWithProgids
  fileAssociations:
    - ext: pdf
      name: PDEfe.pdf
      description: PDF belgesi
      role: Viewer
      icon: build/icon.ico
  publish:
    provider: github
    owner: SCgrS
    repo: PDEfe
    releaseType: draft

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  # electron-builder'ın kendi sihirbazında masaüstü kısayolu için onay kutusu yoktur; kısayol her zaman
  # oluşturulur. build/installer.nsh "Ek görevler" sayfasıyla seçilebilir hale getirir (bkz. customPageAfterChangeDir).
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PDEfe
  installerLanguages:
    - tr_TR
  language: "1055"
  license: LICENSE
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: PDEfe
  artifactName: "PDEfe-Setup.${ext}"
  differentialPackage: true

# ---------------------------------------------------------------- macOS (0.2.0)
# Tek DMG hem Apple işlemcili (arm64) hem Intel (x64) Mac'te çalışır (evrensel: electron-builder --mac --universal). Python çekirdeği
# mimariye özgüdür ve tek dosyada birleştirilemez (PyMuPDF / Pillow tekerlekleri mimari başına): iki mimarinin PyInstaller çıktısı CI'da
# ayrı Mac'lerde derlenip core/dist/pdefe-core-arm64 ve -x64'e konur, ikisi de pakete girer; cekirdek.js process.arch'a göre seçer.
# İki ara pakette aynı dosyalar olduğundan birleştirici (@electron/universal) onları lipo'lamaz, olduğu gibi alır (x64ArchFiles).
# İmza: Apple geliştirici kimliği yok (kullanıcı kararı, 2026-10-02): yerinde (ad-hoc, "-") imzalanır. Apple işlemcili Mac imzasız kodu
# hiç çalıştırmaz; yerinde imzalı uygulamayı ilk açılışta bir kez Sistem Ayarları › Gizlilik ve Güvenlik › "Yine de Aç" ile açar.
# Sertleştirilmiş çalışma ortamı (hardenedRuntime) yerinde imzayla kitaplık doğrulamasına takılır (çekirdeğin kitaplıkları): kapalı.
mac:
  target:
    - target: dmg
      arch:
        - universal
  icon: build/icon.png          # 512×512; electron-builder .icns'e çevirir
  category: public.app-category.productivity
  minimumSystemVersion: "13.0"  # Electron 44'ün en düşük macOS sürümü: 13 Ventura (Chromium macOS 12'yi bıraktı; 0.2.0'daki 12.0 yanlıştı, 0.2.1)
  darkModeSupport: true
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  x64ArchFiles: "Contents/Resources/pdefe-core-*/{**,**/.*/**}"   # .*/: Pillow'un .dylibs klasörü (minimatch'te ** nokta klasörüne girmez)
  extraResources:
    - from: core/dist/pdefe-core-arm64
      to: pdefe-core-arm64
    - from: core/dist/pdefe-core-x64
      to: pdefe-core-x64
  # Finder'da "Birlikte aç" listesinde görünür; varsayılan uygulamayı kullanıcı Bilgi Al'dan seçer (Alternate: sistemin PDF görüntüleyicisinin
  # yerine kendiliğinden geçmez). Uzantıyla tanımlanır (CFBundleTypeExtensions): PDF'in sistem tür kimliğinde bir marka adı geçer
  fileAssociations:
    - ext: pdf
      name: PDF belgesi
      role: Editor
      rank: Alternate
  extendInfo:
    CFBundleDevelopmentRegion: tr
    # macOS bu klasörlere ilk erişimde izin sorar (araçların çıktısı varsayılan olarak Masaüstü'ne yazılır, son açılanlar yeniden açılır)
    NSDesktopFolderUsageDescription: PDEfe, Masaüstü'ndeki PDF belgelerini açmak ve araçların çıktısını kaydetmek için erişim ister.
    NSDocumentsFolderUsageDescription: PDEfe, Belgeler klasöründeki PDF belgelerini açmak ve kaydetmek için erişim ister.
    NSDownloadsFolderUsageDescription: PDEfe, İndirilenler klasöründeki PDF belgelerini açmak ve kaydetmek için erişim ister.
    NSRemovableVolumesUsageDescription: PDEfe, çıkarılabilir disklerdeki PDF belgelerini açmak ve kaydetmek için erişim ister.
    NSNetworkVolumesUsageDescription: PDEfe, ağ sürücülerindeki PDF belgelerini açmak ve kaydetmek için erişim ister.

dmg:
  title: PDEfe
  artifactName: "PDEfe-Mac.${ext}"   # README'deki tek bağlantı: releases/latest/download/PDEfe-Mac.dmg
  format: ULFO                       # lzfse; macOS 10.11+
  writeUpdateInfo: false             # Mac güncellemesi tarayıcıdan indirilir (main/macGuncelleme.js), blockmap gerekmez
