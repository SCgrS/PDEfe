<!DOCTYPE html>
<html lang="tr" data-tema="acik">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' pdefe:; script-src 'self' pdefe:; style-src 'self' pdefe: 'unsafe-inline'; img-src 'self' pdefe: data: blob:; font-src 'self' pdefe: data:; worker-src 'self' pdefe: blob:; connect-src 'self' pdefe: blob: data:; object-src 'none'; base-uri 'none'; form-action 'none';">
  <title>PDEfe</title>
  <link rel="stylesheet" href="stil.css">
  <link rel="stylesheet" href="araclar/araclar.css">
  <link rel="stylesheet" href="aracPenceresi.css">
</head>
<body>
  <div id="uygulama">
    <!-- Araç çubuğu -->
    <header id="arac-cubugu">
      <div class="grup">
        <button class="ikon" data-komut="gorunum.solPanel" title="Sol panel (F4)"><svg viewBox="0 0 20 20"><rect x="2.5" y="4" width="15" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7.5 4v12" stroke="currentColor" stroke-width="1.4"/></svg></button>
        <button class="ikon" data-komut="dosya.kaydet" title="Kaydet (Ctrl+S)" disabled><svg viewBox="0 0 20 20"><path d="M4 3h9l3 3v11H4z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 3v4h5V3M6 17v-5h8v5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      </div>
      <div class="ayrac"></div>
      <div class="grup">
        <button class="ikon" data-komut="duzen.geriAl" id="dugme-geri-al" title="Geri al (Ctrl+Z)" disabled><svg viewBox="0 0 20 20"><path d="M7 5 3.5 8.5 7 12M4 8.5h8a4 4 0 0 1 0 8H9" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
        <button class="ikon" data-komut="duzen.yinele" id="dugme-yinele" title="Yinele (Ctrl+Y)" disabled><svg viewBox="0 0 20 20"><path d="m13 5 3.5 3.5L13 12M16 8.5H8a4 4 0 0 0 0 8h3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      </div>
      <div class="ayrac"></div>
      <div class="grup">
        <button class="ikon" data-komut="gorunum.oncekiSayfa" title="Önceki sayfa"><svg viewBox="0 0 20 20"><path d="m10 4-6 6 6 6M4 10h13" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
        <input id="sayfa-kutusu" class="kutu" type="text" inputmode="numeric" value="" title="Sayfa (Ctrl+G)">
        <span id="sayfa-toplam" class="soluk">/ 0</span>
        <button class="ikon" data-komut="gorunum.sonrakiSayfa" title="Sonraki sayfa"><svg viewBox="0 0 20 20"><path d="m10 4 6 6-6 6M16 10H3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      </div>
      <div class="ayrac"></div>
      <div class="grup">
        <button class="ikon" data-komut="gorunum.uzaklastir" title="Uzaklaştır (Ctrl+−)"><svg viewBox="0 0 20 20"><path d="M4 10h12" stroke="currentColor" stroke-width="1.6"/></svg></button>
        <input id="zoom-kutusu" class="kutu" type="text" value="%100" title="Yakınlaştırma">
        <button class="ikon" data-komut="gorunum.yakinlastir" title="Yakınlaştır (Ctrl++)"><svg viewBox="0 0 20 20"><path d="M4 10h12M10 4v12" stroke="currentColor" stroke-width="1.6"/></svg></button>
        <button class="ikon acilir" id="dugme-zoom-secenek" title="Yakınlaştırma seçenekleri"><svg viewBox="0 0 20 20"><path d="m5 8 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      </div>
      <div class="ayrac"></div>
      <div class="grup">
        <button class="ikon" id="dugme-duzen" title="Sayfa düzeni"><svg viewBox="0 0 20 20"><rect x="3" y="3" width="6" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="3" width="6" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
        <button class="ikon" data-komut="gorunum.dondur" data-veri="90" title="Döndür (Ctrl+R)"><svg viewBox="0 0 20 20"><path d="M6.9 15.8A6.2 6.2 0 1 1 14.9 13.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M17.2 15.5 12.6 12.3 13.2 16.4z" fill="currentColor"/></svg></button>
        <button class="ikon" data-komut="duzen.bul" title="Bul (Ctrl+F)"><svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m12.5 12.5 4.5 4.5" stroke="currentColor" stroke-width="1.6"/></svg></button>
      </div>
      <div class="ayrac"></div>
      <div class="grup" id="not-araclari">
        <button class="ikon arac" data-arac="not" title="Not"><svg viewBox="0 0 20 20"><path d="M3 4.5A1.5 1.5 0 0 1 4.5 3h11A1.5 1.5 0 0 1 17 4.5v8a1.5 1.5 0 0 1-1.5 1.5H9l-4 3v-3H4.5A1.5 1.5 0 0 1 3 12.5z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
        <button class="ikon arac" data-arac="vurgu" title="Vurgu"><svg viewBox="0 0 20 20"><path d="m5 13 8-8 2 2-8 8H5z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 17h14" stroke="currentColor" stroke-width="2.4" opacity=".6"/></svg></button>
        <button class="ikon arac" data-arac="yazi" title="Yazı"><svg viewBox="0 0 20 20"><path d="M4 5h12M10 5v11M7 16h6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      </div>
      <div class="ayrac"></div>
      <div class="grup">
        <!-- Araçlar penceresi (aracPenceresi.js): küçült, sayfaları düzenle, döndür ve kaydet, ayır, görüntü / PDF birleştir (PDF'i kopyala: sağdaki düğme ve Araçlar menüsü) -->
        <button class="ikon metinli" id="dugme-araclar" title="Araçlar" aria-haspopup="dialog" aria-expanded="false" aria-controls="araclar-penceresi"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="2.5" y="6.5" width="15" height="10" rx="1.5"/><path d="M7 6.5V4.8c0-.7.6-1.3 1.3-1.3h3.4c.7 0 1.3.6 1.3 1.3v1.7M2.5 10.75h5.5M12 10.75h5.5"/><rect x="8" y="9.5" width="4" height="2.5" rx=".6"/></svg><span class="etiket">Araçlar</span><svg class="ok" viewBox="0 0 20 20"><path d="m6 8 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
      </div>
      <div class="esnek"></div>
      <div class="grup">
        <!-- Menü çubuğunu göster / gizle (0.1.24): varsayılan gizli, seçim hatırlanır (ayar menuCubugu); basılıyken çubuk görünür -->
        <button class="ikon" data-komut="gorunum.menuCubugu" id="dugme-menu" title="Menü çubuğunu göster" aria-pressed="false"><svg viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 8h15" stroke="currentColor" stroke-width="1.4"/><path d="M5.2 5.75h2M8.9 5.75h2M12.6 5.75h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        <!-- PDF'i kopyala: dosyayı panoya kopyalar (0.1.12'den beri kopyala simgesiyle; 0.1.21'e dek adı "Paylaş"tı); yanında Ayarlar -->
        <button class="ikon" data-komut="arac.paylas" title="PDF'i kopyala: dosyayı panoya kopyalar"><svg viewBox="0 0 20 20"><rect x="7" y="7" width="9" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M13 7V4.5A1.5 1.5 0 0 0 11.5 3h-6A1.5 1.5 0 0 0 4 4.5v8A1.5 1.5 0 0 0 5.5 14H7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
        <button class="ikon" data-komut="duzen.ayarlar" id="dugme-ayarlar" title="Ayarlar (Ctrl+,)"><svg viewBox="0 0 20 20"><path d="M8.42 4.31L8.73 2.41A7.7 7.7 0 0 1 11.27 2.41L11.58 4.31A5.9 5.9 0 0 1 12.91 4.86L14.47 3.73A7.7 7.7 0 0 1 16.27 5.53L15.14 7.09A5.9 5.9 0 0 1 15.69 8.42L17.59 8.73A7.7 7.7 0 0 1 17.59 11.27L15.69 11.58A5.9 5.9 0 0 1 15.14 12.91L16.27 14.47A7.7 7.7 0 0 1 14.47 16.27L12.91 15.14A5.9 5.9 0 0 1 11.58 15.69L11.27 17.59A7.7 7.7 0 0 1 8.73 17.59L8.42 15.69A5.9 5.9 0 0 1 7.09 15.14L5.53 16.27A7.7 7.7 0 0 1 3.73 14.47L4.86 12.91A5.9 5.9 0 0 1 4.31 11.58L2.41 11.27A7.7 7.7 0 0 1 2.41 8.73L4.31 8.42A5.9 5.9 0 0 1 4.86 7.09L3.73 5.53A7.7 7.7 0 0 1 5.53 3.73L7.09 4.86A5.9 5.9 0 0 1 8.42 4.31z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
        <button class="ikon" data-komut="gorunum.tema" id="dugme-tema" title="Açık tema açık — koyu temaya geç"><svg class="ay" viewBox="0 0 20 20"><path d="M7.24 3.03A7.5 7.5 0 1 0 16.97 12.76A7 7 0 0 1 7.24 3.03z" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/></svg><svg class="gunes" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.6" fill="currentColor"/><path d="M10 1.9v1.9M10 16.2v1.9M1.9 10h1.9M16.2 10h1.9M4.27 4.27l1.34 1.34M14.39 14.39l1.34 1.34M4.27 15.73l1.34-1.34M14.39 5.61l1.34-1.34" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      </div>
    </header>

    <!-- Güncelleme şeridi -->
    <div id="guncelleme-seridi" hidden></div>

    <!-- Sekme çubuğu: hiç gizlenmez (0.1.21); pencerede en az bir sekme vardır, belge yokken açılış sekmesi -->
    <div id="sekme-cubugu">
      <button class="ikon sekme-ok" id="sekme-onceki" title="Önceki sekme"><svg viewBox="0 0 20 20"><path d="m12 4-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <div id="sekme-liste"></div>
      <!-- Yeni sekme: açılış sayfası yeni sekmede (uygulama.js yeniSekme); son sekmenin hemen sağında, sekmeler sığmayınca sağda sabit -->
      <button class="ikon" id="sekme-yeni" data-komut="sekme.yeni" title="Yeni sekme (Ctrl+T)" aria-label="Yeni sekme"><svg viewBox="0 0 20 20"><path d="M10 4.5v11M4.5 10h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <div class="esnek"></div>
      <button class="ikon sekme-ok" id="sekme-sonraki" title="Sonraki sekme"><svg viewBox="0 0 20 20"><path d="m8 4 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <button class="ikon" id="sekme-acilir" title="Açık belgeler"><svg viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h9" stroke="currentColor" stroke-width="1.6"/></svg></button>
    </div>

    <!-- Gövde -->
    <div id="govde">
      <aside id="sol-panel" hidden>
        <nav class="panel-sekmeler">
          <button data-panel="sayfalar" class="secili">Sayfalar</button>
          <button data-panel="icindekiler">İçindekiler</button>
          <button data-panel="yorumlar">Yorumlar</button>
        </nav>
        <div class="panel-icerik" id="panel-sayfalar"></div>
        <div class="panel-icerik" id="panel-icindekiler" hidden></div>
        <div class="panel-icerik" id="panel-yorumlar" hidden></div>
        <div class="tutamac" id="panel-tutamac"></div>
      </aside>
      <main id="belge-alani">
        <div id="gorunumler"></div>
        <!-- Başlangıç ekranı (baslangic.js): açık belge yokken; #gorunumler'in üstünde -->
        <div id="baslangic"></div>
        <div id="bul-kutusu" hidden></div>
        <div id="secim-cubugu" hidden></div>
      </main>
    </div>

    <!-- Durum çubuğu -->
    <footer id="durum-cubugu">
      <span id="durum-sayfa" title="Sayfaya git (Ctrl+G)">Sayfa <input id="durum-sayfa-kutusu" type="text" inputmode="numeric" value=""> / <span id="durum-sayfa-toplam">0</span></span>
      <span class="ayrac"></span>
      <span id="durum-zoom">%100</span>
      <span class="ayrac"></span>
      <span id="durum-boyut"></span>
      <span class="esnek"></span>
      <span id="durum-degisiklik" hidden>● Kaydedilmemiş değişiklikler</span>
      <span id="durum-mesaj"></span>
    </footer>

    <!-- Sekme seçici (Ctrl+Tab) -->
    <div id="sekme-secici" hidden></div>
    <!-- Açık belgeler listesi -->
    <div id="belge-listesi" hidden></div>
    <!-- Bildirim -->
    <div id="bildirim" hidden></div>
    <!-- Sürükle-bırak örtüsü -->
    <div id="surukle-ortusu" hidden><div>PDF'i bırakın</div></div>
  </div>
  <script type="module" src="uygulama.js"></script>
</body>
</html>
